[project]
name = "ml-deduplication"
version = "0.1.0"
description = "Machine learning project for acteur deduplication."
readme = "README.md"
requires-python = ">=3.13"
# Base dependencies = the minimal set required to run inference
# (ml_deduplication.inference.xgboost.run_inference). Heavier training / EDA
# packages live in the `training` dependency group and are opt-in via
# `uv sync --group training` (or `uv sync --all-groups`).
dependencies = [
    "connectorx>=0.4.5",
    "duckdb>=1.5.5",
    "polars>=1.44.1",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=24.0.0",
    "xgboost>=2.1.0",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.49",
    "tqdm>=4.69.0",
    "sentence-transformers>=5.7.0",
    "polars-distance>=0.5.3",
]

[dependency-groups]
dev = ["ipykernel>=7.3.0", "pandas>=3.0.3", "py-spy>=0.4.2", "ruff>=0.15.18"]
# Training / EDA packages. Opt-in so that `uv sync` stays lean (inference-only).
training = [
    "dedupe>=3.0.3",
    "plotly>=6.9.0",
    "psycopg2>=2.9.12",
    "splink>=4,<5",
    "tqdm-joblib>=0.0.5",
    "spatial-polars>=0.3.0",
    "optuna>=4.9.0",
]
notebooks = [
    "jupyterlab>=4.6.3",
    "jupyterlab-code-formatter>=3.1.0",
    "jupyterlab-execute-time>=3.3.0",
    "jupyterlab-lsp>=5.3.0",
    "python-lsp-server[all]>=1.15.0",
    "polars-distance>=0.5.3",
    "shapely>=2.1.2",
    "geopy>=2.5.0",
    "ipywidgets>=8.1.8",
]

[tool.ruff.lint.isort]
known-first-party = ["ml_deduplication"]

[build-system]
requires = ["uv_build>=0.12.3,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ml_deduplication"
module-root = ""
