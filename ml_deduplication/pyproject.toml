[project]
name = "ml-deduplication"
version = "0.1.0"
description = "Machine learning project for acteur deduplication."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "connectorx>=0.4.5",
    "duckdb>=1.5.5",
    "dedupe>=3.0.3",
    "plotly>=6.9.0",
    "polars>=1.42.0",
    "psycopg2>=2.9.12",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=24.0.0",
    "xgboost>=2.1.0",
    "scikit-learn>=1.9.0",
    "sqlalchemy>=2.0.49",
    "tqdm>=4.69.0",
    "tqdm-joblib>=0.0.5",
]

[dependency-groups]
dev = ["ipykernel>=7.3.0", "pandas>=3.0.3", "py-spy>=0.4.2", "ruff>=0.15.18"]
