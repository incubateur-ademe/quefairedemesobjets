server {
    listen 8080;
    server_name ~^pr-(?<pr>[1-9][0-9]*)\.preview\.quefairedemesdechets\.fr$;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json
        application/geo+json image/svg+xml;
    add_header X-Robots-Tag "noindex, nofollow" always;
    location /static/ {
        proxy_pass https://qfdmodpreview6b0061c2-lvao-pr-${pr}-webapp.functions.fnc.fr-par.scw.cloud;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Host qfdmodpreview6b0061c2-lvao-pr-${pr}-webapp.functions.fnc.fr-par.scw.cloud;
        proxy_ssl_server_name on;
        proxy_ssl_name qfdmodpreview6b0061c2-lvao-pr-${pr}-webapp.functions.fnc.fr-par.scw.cloud;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header X-Auth-Token "00000000-0000-4000-8000-000000000000";
        proxy_cache off;
        proxy_cache_key $scheme$host$request_uri;
        proxy_ignore_headers Cache-Control Expires X-Accel-Expires;
        proxy_cache_valid 200 1d;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ~ ^/(static/)?(iframe|carte)\.js$ {
        proxy_pass https://qfdmodpreview6b0061c2-lvao-pr-${pr}-webapp.functions.fnc.fr-par.scw.cloud;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Host qfdmodpreview6b0061c2-lvao-pr-${pr}-webapp.functions.fnc.fr-par.scw.cloud;
        proxy_ssl_server_name on;
        proxy_ssl_name qfdmodpreview6b0061c2-lvao-pr-${pr}-webapp.functions.fnc.fr-par.scw.cloud;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header X-Auth-Token "00000000-0000-4000-8000-000000000000";
        proxy_cache off;
        proxy_cache_key $scheme$host$request_uri;
        proxy_cache_valid 200 301 302 10m;
        proxy_cache_valid 404 1m;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    resolver <nameservers> valid=300s ipv6=off;
    resolver_timeout 5s;
    set $posthog_api_host eu.i.posthog.com;
    set $posthog_assets_host eu-assets.i.posthog.com;
    set $ign_host data.geopf.fr;
    location /ph/static/ {
        rewrite ^/ph(/.*)$ $1 break;
        proxy_pass https://$posthog_assets_host;
        proxy_set_header Host $posthog_assets_host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Auth-Token "";
        proxy_ssl_server_name on;
        proxy_ssl_name $posthog_assets_host;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    }
    location /ph/array/ {
        rewrite ^/ph(/.*)$ $1 break;
        proxy_pass https://$posthog_assets_host;
        proxy_set_header Host $posthog_assets_host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Auth-Token "";
        proxy_ssl_server_name on;
        proxy_ssl_name $posthog_assets_host;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    }
    location /ph/ {
        rewrite ^/ph(/.*)$ $1 break;
        proxy_pass https://$posthog_api_host;
        proxy_set_header Host $posthog_api_host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization $posthog_authorization;
        proxy_set_header X-Auth-Token "";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_ssl_server_name on;
        proxy_ssl_name $posthog_api_host;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    }
    location /tuiles/plan-ign/ {
        rewrite ^/tuiles/plan-ign(/.*)$ /tms/1.0.0/PLAN.IGN$1 break;
        proxy_pass https://$ign_host;
        proxy_set_header Host $ign_host;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header X-Auth-Token "";
        proxy_hide_header Set-Cookie;
        proxy_ssl_server_name on;
        proxy_ssl_name $ign_host;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        gzip_types application/x-protobuf;
    }
    location /admin {
        proxy_pass https://qfdmodpreview6b0061c2-lvao-pr-${pr}-webapp.functions.fnc.fr-par.scw.cloud;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Host qfdmodpreview6b0061c2-lvao-pr-${pr}-webapp.functions.fnc.fr-par.scw.cloud;
        proxy_ssl_server_name on;
        proxy_ssl_name qfdmodpreview6b0061c2-lvao-pr-${pr}-webapp.functions.fnc.fr-par.scw.cloud;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header X-Auth-Token "00000000-0000-4000-8000-000000000000";
        client_max_body_size 100m;
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
        proxy_cache_bypass 1;
        proxy_no_cache 1;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location / {
        proxy_pass https://qfdmodpreview6b0061c2-lvao-pr-${pr}-webapp.functions.fnc.fr-par.scw.cloud;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Host qfdmodpreview6b0061c2-lvao-pr-${pr}-webapp.functions.fnc.fr-par.scw.cloud;
        proxy_ssl_server_name on;
        proxy_ssl_name qfdmodpreview6b0061c2-lvao-pr-${pr}-webapp.functions.fnc.fr-par.scw.cloud;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header X-Auth-Token "00000000-0000-4000-8000-000000000000";
        proxy_read_timeout 30s;
        proxy_connect_timeout 15s;
        proxy_cache_bypass $no_cache;
        proxy_no_cache $no_cache;
        proxy_cache off;
        proxy_cache_key $request_method$scheme$host$uri?$cache_args$http_sec_fetch_dest;
        proxy_cache_valid 200 301 302 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 10s;
        proxy_cache_use_stale error timeout updating;
        proxy_cache_background_update on;
        add_header X-Cache-Status $upstream_cache_status always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
    location ~ ^/(favicon(?:-\d+)?.(?:jpe?g|png|ico))$ {
        access_log off;
        log_not_found off;
    }
}
