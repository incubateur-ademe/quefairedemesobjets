{% if host_is_beta %}
  <div class="fr-alert fr-alert--success fr-mb-3w">
    <p><code>{{ host }}</code> est dans <code>ASSISTANT_V2_BETA_TESTERS_HOSTS</code>.</p>
  </div>
{% else %}
  <div class="fr-alert fr-alert--warning fr-mb-3w">
    <p>
      <code>{{ host }}</code> n'est pas dans <code>ASSISTANT_V2_BETA_TESTERS_HOSTS</code> : l'iframe restera sur la V1.
      Ajoutez <code>ASSISTANT_V2_BETA_TESTERS_HOSTS={{ host }}</code> à <code>webapp/.env</code> et relancez le serveur.
    </p>
  </div>
{% endif %}
