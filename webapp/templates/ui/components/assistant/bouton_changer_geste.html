<a class="qfa-changer-geste" href="{{ url }}">
    <span class="qfa-changer-geste__retour" aria-hidden="true"></span>
    {% if gestes %}
        <span class="qfa-changer-geste__icones">
            {% for geste in gestes %}
                {% include "ui/components/assistant/icone_geste.html" with geste=geste %}
            {% endfor %}
        </span>
    {% endif %}
    <span class="qfa-changer-geste__libelle">{{ libelle }}</span>
</a>
