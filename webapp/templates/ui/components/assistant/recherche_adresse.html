{% comment %}`unlocalize`: « -1,55 » is not a number.{% endcomment %}
{% load l10n %}
{% url 'api_v1:adresses' as url_recherche %}
{% firstof id "recherche-adresse" as base_id %}
<div class="qfa-combobox"
     id="{{ base_id }}"
     data-controller="assistant-combobox"
     data-assistant-combobox-url-value="{{ url_recherche }}"
     data-assistant-combobox-min-length-value="3"
     data-assistant-combobox-require-choice-value="true">
    <label class="qfa-combobox__label" for="{{ base_id }}-champ">
        {{ label|default:"Où souhaitez-vous trouver des solutions ?" }}
    </label>

    <span class="qfa-combobox__cadre">
        <span class="qfa-combobox__loupe" aria-hidden="true"></span>
        <input type="text"
               id="{{ base_id }}-champ"
               name="adresse"
               class="qfa-combobox__champ"
               value="{{ adresse|default:'' }}"
               data-assistant-combobox-target="input"
               data-action="input->assistant-combobox#search
                            keydown->assistant-combobox#navigate"
               role="combobox"
               aria-expanded="false"
               aria-controls="{{ base_id }}-liste"
               aria-autocomplete="list"
               autocomplete="off"
               autocorrect="off"
               spellcheck="false"
               {% if erreur %}aria-describedby="{{ base_id }}-erreur" aria-invalid="true"{% endif %}
               placeholder="{{ placeholder|default:'ex : une adresse ou commune' }}">
    </span>

    <ul class="qfa-combobox__liste"
        id="{{ base_id }}-liste"
        role="listbox"
        data-assistant-combobox-target="list"
        data-action="mousedown->assistant-combobox#keepFocus
                     click->assistant-combobox#chooseFromClick"
        hidden></ul>

    <input type="hidden" name="longitude" value="{{ longitude|default:''|unlocalize }}"
           data-assistant-combobox-target="hidden" data-key="longitude">
    <input type="hidden" name="latitude" value="{{ latitude|default:''|unlocalize }}"
           data-assistant-combobox-target="hidden" data-key="latitude">
    <input type="hidden" name="precise" value="{{ precise|default:'' }}"
           data-assistant-combobox-target="hidden" data-key="precise">

    {% if erreur %}
        <p class="qfa-combobox__erreur" data-assistant-combobox-target="erreur" id="{{ base_id }}-erreur">
            {{ erreur }}
        </p>
    {% endif %}

    <p class="qfa-combobox__erreur" id="{{ base_id }}-aucun-resultat"
       data-assistant-combobox-target="aucunResultat" hidden></p>

    <p class="qfa-sr-only" role="status"
       data-assistant-combobox-target="status"></p>
</div>
