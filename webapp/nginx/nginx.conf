worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # `gzip_static` serves the .gz collectstatic writes; requests come
    # through the Scaleway proxy, hence `gzip_proxied any`.
    gzip on;
    gzip_static on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json
        application/geo+json image/svg+xml;
    include /etc/nginx/servers.conf;
}
