---
# Exported by the Makefile from data-platform/pyproject.toml. Without make:
# AIRFLOW_VERSION=$(make -s airflow-version) docker compose --profile airflow build
x-airflow-build-args: &airflow-build-args
  AIRFLOW_VERSION: ${AIRFLOW_VERSION:-}

x-airflow-common: &airflow-common
  tmpfs:
    - /tmp
  env_file:
    - ./data-platform/dags/.env
  volumes:
    - ./data-platform/config:/opt/airflow/config
    - ./data-platform/dags:/opt/airflow/dags
    - ./docs/reference/data-platform:/opt/airflow/docs/reference/data-platform
    - ./data-platform/dbt:/opt/airflow/dbt
    - ./data-platform/logs:/opt/airflow/logs
    - ./data-platform/plugins:/opt/airflow/plugins
    - ./data-platform/scripts:/opt/airflow/scripts
    # Docker socket (lecture seule) pour exécuter l'inférence ML localement via
    # `docker run` (mode run_locally du DAG ml_deduplication), sans provisionner
    # d'instance Scaleway. Mis ici (et non dans la seule tâche scheduler) car
    # redéfinir `volumes` sur une service REMPLACE la liste de l'anchor au lieu
    # de la fusionner : une entrée sur le scheduler seul supprimerait tous les
    # autres montages (dont /opt/airflow/dags).
    - /var/run/docker.sock:/var/run/docker.sock
  # Voir la doc et s'assurer que AIRFLOW_UID est
  # définit dans le .env pour correspondre à votre UID
  # sed -i '/^AIRFLOW_UID=/d' .env && echo "AIRFLOW_UID=$(id -u)" >> .env
  user: "${AIRFLOW_UID:-50000}:0"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on: &airflow-common-depends-on
    airflow-db:
      condition: service_healthy

# Every variable below has a default that works on the Compose network: a fresh
# clone needs no .env. The root .env only holds secrets and overrides, for
# example DATABASE_URL to work against another Postgres.
x-webapp-common: &webapp-common
  build:
    context: .
    dockerfile: webapp/Dockerfile
    target: dev
  # The host user, so that files written in the bind mount belong to it
  user: "${HOST_UID:-0}:0"
  volumes:
    - .:/app
  env_file:
    - path: ./.env
      required: false
  environment:
    DJANGO_SETTINGS_MODULE: settings.dev
    SECRET_KEY: ${SECRET_KEY:-local-development-only} # pragma: allowlist secret
    DEBUG: ${DEBUG:-True}
    WITH_DJANGO_DEBUG_TOOLBAR: ${WITH_DJANGO_DEBUG_TOOLBAR:-True}
    BASE_URL: ${BASE_URL:-https://quefairedemesdechets.ademe.local}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,webapp,host.docker.internal}
    DATABASE_URL: ${DATABASE_URL:-postgres://webapp:webapp@lvao-webapp-db:5432/webapp} # pragma: allowlist secret
    DB_WEBAPP_SAMPLE: ${DB_WEBAPP_SAMPLE:-postgres://webapp_sample:webapp_sample@lvao-webapp-db:5432/webapp_sample} # pragma: allowlist secret
    DB_WAREHOUSE: ${DB_WAREHOUSE:-postgres://warehouse:warehouse@lvao-warehouse-db:5432/warehouse} # pragma: allowlist secret
  depends_on:
    lvao-webapp-db:
      condition: service_healthy
  develop:
    watch:
      - action: rebuild
        path: ./uv.lock

services:
  webapp:
    <<: *webapp-common
    # Migrations first: a git pull that brings new ones cannot leave the
    # database behind the code.
    command: >
      sh -c "python manage.py migrate --noinput
      && python manage.py createcachetable
      && exec python manage.py runserver 0.0.0.0:8000"
    ports:
      - ${WEBAPP_PORT:-8000}:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 5s
      retries: 5
      start_period: 120s

  # Processes the background tasks (django-tasks) enqueued by the webapp
  worker:
    <<: *webapp-common
    command: python manage.py db_worker
    depends_on:
      webapp:
        condition: service_healthy

  # Installs the JS dependencies and rebuilds the assets on change
  assets:
    build:
      context: .
      dockerfile: webapp/Dockerfile
      target: node_base
    user: "${HOST_UID:-0}:0"
    working_dir: /app
    command: webapp/bin/dev-assets.sh
    volumes:
      - .:/app
      # Linux binaries, kept apart from the node_modules of the host
      - node_modules:/app/node_modules
      - webapp_node_modules:/app/webapp/node_modules
      - revue_node_modules:/app/webapp/revue-front/node_modules
    environment:
      BASE_URL: ${BASE_URL:-https://quefairedemesdechets.ademe.local}
    healthcheck:
      test: ["CMD-SHELL", "ls webapp/static/compiled/*.js"]
      interval: 5s
      retries: 5
      start_period: 600s
    develop:
      watch:
        - action: restart
          path: ./package-lock.json

  lvao-proxy:
    build:
      context: .
      dockerfile: webapp/nginx/Dockerfile
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
    volumes:
      - ./webapp/nginx/certs:/etc/nginx/ssl
      - ./webapp/staticfiles:/app/staticfiles
    environment:
      - BASE_DOMAIN=${BASE_DOMAIN:-quefairedemesdechets.ademe.local}
      - PORT=80
      - DEBUG=${DEBUG:-True}
      - NGINX_DISABLE_CACHE=${NGINX_DISABLE_CACHE:-0}
      - UPSTREAM_HOST=webapp:8000
      - SSL_CERT_PATH=/etc/nginx/ssl/${BASE_DOMAIN:-quefairedemesdechets.ademe.local}.pem
      - SSL_CERT_KEY_PATH=/etc/nginx/ssl/${BASE_DOMAIN:-quefairedemesdechets.ademe.local}-key.pem
    depends_on:
      webapp:
        condition: service_healthy

  lvao-webapp-db:
    # Native architecture by default; POSTGIS_IMAGE_PLATFORM=linux/amd64 forces emulation
    platform: ${POSTGIS_IMAGE_PLATFORM:-}
    image: imresamu/postgis:16-3.5-alpine # The official PostGIS image ships no ARM build
    environment:
      - POSTGRES_USER=webapp
      - POSTGRES_PASSWORD=webapp # pragma: allowlist secret
      - POSTGRES_DB=webapp
    volumes:
      - webapp_dbdata:/var/lib/postgresql/data
    ports:
      - ${WEBAPP_DB_PORT:-6543}:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "webapp"]
      interval: 2s
      retries: 30

  lvao-warehouse-db:
    # Native architecture by default; POSTGIS_IMAGE_PLATFORM=linux/amd64 forces emulation
    platform: ${POSTGIS_IMAGE_PLATFORM:-}
    image: imresamu/postgis:16-3.5-alpine # The official PostGIS image ships no ARM build
    environment:
      - POSTGRES_USER=warehouse
      - POSTGRES_PASSWORD=warehouse # pragma: allowlist secret
      - POSTGRES_DB=warehouse
      - POSTGRES_MULTIPLE_EXTENSIONS=postgis
    volumes:
      - warehouse16_dbdata:/var/lib/postgresql/data
    ports:
      - ${WAREHOUSE_DB_PORT:-8765}:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "warehouse"]
      interval: 2s
      retries: 30
    profiles: [airflow]

  airflow-db:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow # pragma: allowlist secret
      POSTGRES_DB: airflow
    volumes:
      - airflow_dbdata:/var/lib/postgresql/data
    ports:
      - 7654:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    profiles: [airflow]

  airflow-webserver:
    <<: *airflow-common
    environment:
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
      _PIP_ADDITIONAL_REQUIREMENTS: ""
    user: "0:0"
    build:
      context: .
      dockerfile: data-platform/airflow-webserver.Dockerfile
      args:
        <<: *airflow-build-args
    deploy:
      resources:
        limits:
          memory: 2G
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
    profiles: [airflow]

  airflow-scheduler:
    <<: *airflow-common
    env_file:
      - ./data-platform/dags/.env
    build:
      context: .
      dockerfile: data-platform/airflow-scheduler.Dockerfile
      args:
        <<: *airflow-build-args
    deploy:
      resources:
        limits:
          # TODO: read AIRFLOW_SCHEDULER_MEMORY_LIMIT from .env doesn't works
          memory: ${AIRFLOW_SCHEDULER_MEMORY_LIMIT:-12G}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-webserver:
        condition: service_healthy
    profiles: [airflow]

  airflow-dag-processor:
    <<: *airflow-common
    env_file:
      - ./data-platform/dags/.env
    build:
      context: .
      dockerfile: data-platform/airflow-dag-processor.Dockerfile
      args:
        <<: *airflow-build-args
    ports:
      - "8082:80"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-webserver:
        condition: service_healthy
    profiles: [airflow]

volumes:
  webapp_dbdata:
  # Renamed with the move to Postgres 16: a 15 data directory does not start on 16
  warehouse16_dbdata:
  airflow_dbdata:
  node_modules:
  webapp_node_modules:
  revue_node_modules:
