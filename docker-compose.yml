---
# The versions are exported by the Makefile, from .tool-versions and from
# data-platform/pyproject.toml for Airflow: build the images with make.
x-airflow-build-args: &airflow-build-args
  AIRFLOW_VERSION: ${AIRFLOW_VERSION:-}
  PYTHON_VERSION: ${PYTHON_VERSION:-}
  UV_VERSION: ${UV_VERSION:-}

x-airflow-common: &airflow-common
  tmpfs:
    - /tmp
  # Secrets only (Scaleway keys…), cf. .env.template
  env_file:
    - path: ./.env
      required: false
  environment:
    ENVIRONMENT: development
    SECRET_KEY: ${SECRET_KEY:-local-development-only} # pragma: allowlist secret
    _AIRFLOW_DB_MIGRATE: "true"
    _AIRFLOW_WWW_USER_CREATE: "true"
    _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
    _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
    # Project classes (Pydantic configs…) pushed to XCom; Airflow 3 handles
    # DataFrames, BaseModel and numpy types natively
    AIRFLOW__CORE__ALLOWED_DESERIALIZATION_CLASSES_REGEXP: 'airflow\..* acteurs\..* clone\..* cluster\..* crawl\..* enrich\..* shared\..* sources\..* stats\..* suggestions\..* tools\..* utils\..*'
    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW__API_AUTH__JWT_SECRET:-local-development-only} # pragma: allowlist secret
    # Widens the dialogs (trigger DAG…) to 95% of the screen
    AIRFLOW__API__THEME: '{"globalCss":{"[data-scope=\"dialog\"][data-part=\"content\"]":{"max-width":"95vw !important"}}}'
    AIRFLOW__API__WORKERS: "2"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__WEBSERVER__WARN_DEPLOYMENT_EXPOSURE: "false"
    AIRFLOW__WEBSERVER__X_FRAME_ENABLED: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__SCHEDULER__CATCHUP_BY_DEFAULT: "false"
    AIRFLOW__DAG_PROCESSOR__MIN_FILE_PROCESS_INTERVAL: "30"
    AIRFLOW__DAG_PROCESSOR__PARSING_PROCESSES: "1"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow # pragma: allowlist secret
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONNECT_ARGS: airflow_local_settings.keepalive_kwargs
    # Read by data-platform/scripts/db_cleanup.sh
    AIRFLOW_METADATA_DB_URL: postgresql+psycopg2://airflow:airflow@airflow-db/airflow # pragma: allowlist secret
    AIRFLOW_CONN_WEBAPP_DB: ${DATABASE_URL:-postgres://webapp:webapp@webapp-db:5432/webapp} # pragma: allowlist secret
    DATABASE_URL: ${DATABASE_URL:-postgres://webapp:webapp@webapp-db:5432/webapp} # pragma: allowlist secret
    DB_WEBAPP_SAMPLE: ${DB_WEBAPP_SAMPLE:-postgres://webapp_sample:webapp_sample@webapp-db:5432/webapp_sample} # pragma: allowlist secret
    DB_WAREHOUSE: ${DB_WAREHOUSE:-postgres://warehouse:warehouse@warehouse-db:5432/warehouse} # pragma: allowlist secret
    # API calls from the DAGs (acteur model metadata when parsing them)
    WEBAPP_URL: http://webapp:8000
    # dbt
    POSTGRES_HOST: warehouse-db
    POSTGRES_PORT: "5432"
    POSTGRES_USER: warehouse
    POSTGRES_PASSWORD: warehouse # pragma: allowlist secret
    POSTGRES_DB: warehouse
    POSTGRES_SCHEMA: public
    # The ml_deduplication DAG runs the inference with the local Docker
    # instead of a Scaleway instance
    ML_DEDUPLICATION_RUN_LOCAL: "1"
  volumes:
    - ./data-platform/config:/opt/airflow/config
    - ./data-platform/dags:/opt/airflow/dags
    - ./docs/reference/data-platform:/opt/airflow/docs/reference/data-platform
    - ./data-platform/dbt:/opt/airflow/dbt
    - ./data-platform/logs:/opt/airflow/logs
    - ./data-platform/plugins:/opt/airflow/plugins
    - ./data-platform/scripts:/opt/airflow/scripts
    # Docker socket (lecture seule) pour exécuter l'inférence ML localement via
    # `docker run` (mode run_locally du DAG ml_deduplication), sans provisionner
    # d'instance Scaleway. Mis ici (et non dans la seule tâche scheduler) car
    # redéfinir `volumes` sur une service REMPLACE la liste de l'anchor au lieu
    # de la fusionner : une entrée sur le scheduler seul supprimerait tous les
    # autres montages (dont /opt/airflow/dags).
    - /var/run/docker.sock:/var/run/docker.sock
  # The images own their files as 50000: another user breaks the dag-processor
  user: "${AIRFLOW_UID:-50000}:0"
  extra_hosts:
    - "host.docker.internal:host-gateway"
  depends_on: &airflow-common-depends-on
    airflow-db:
      condition: service_healthy

# Every variable below has a default that works on the Compose network: a fresh
# clone needs no .env. The root .env only holds secrets and overrides, for
# example DATABASE_URL to work against another Postgres.
x-webapp-common: &webapp-common
  build:
    context: .
    dockerfile: webapp/Dockerfile
    target: dev
    args:
      NODE_VERSION: ${NODE_VERSION:-}
      PYTHON_VERSION: ${PYTHON_VERSION:-}
      UV_VERSION: ${UV_VERSION:-}
  # The host user, so that files written in the bind mount belong to it
  user: "${HOST_UID:-0}:0"
  volumes:
    - .:/app
  env_file:
    - path: ./.env
      required: false
  environment:
    DJANGO_SETTINGS_MODULE: settings.dev
    SECRET_KEY: ${SECRET_KEY:-local-development-only} # pragma: allowlist secret
    DEBUG: ${DEBUG:-True}
    WITH_DJANGO_DEBUG_TOOLBAR: ${WITH_DJANGO_DEBUG_TOOLBAR:-True}
    BASE_URL: ${BASE_URL:-http://quefairedemesdechets.localhost}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1,webapp,host.docker.internal}
    DATABASE_URL: ${DATABASE_URL:-postgres://webapp:webapp@webapp-db:5432/webapp} # pragma: allowlist secret
    DB_WEBAPP_SAMPLE: ${DB_WEBAPP_SAMPLE:-postgres://webapp_sample:webapp_sample@webapp-db:5432/webapp_sample} # pragma: allowlist secret
    DB_WAREHOUSE: ${DB_WAREHOUSE:-postgres://warehouse:warehouse@warehouse-db:5432/warehouse} # pragma: allowlist secret
  depends_on:
    webapp-db:
      condition: service_healthy

services:
  webapp:
    <<: *webapp-common
    # Migrations first: a git pull that brings new ones cannot leave the
    # database behind the code.
    command: >
      sh -c "python manage.py migrate --noinput
      && python manage.py createcachetable
      && exec python manage.py runserver 0.0.0.0:8000"
    ports:
      - ${WEBAPP_PORT:-8000}:8000
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), 2)"]
      interval: 5s
      retries: 5
      start_period: 120s

  # Processes the background tasks (django-tasks) enqueued by the webapp
  worker:
    <<: *webapp-common
    command: python manage.py db_worker
    depends_on:
      webapp:
        condition: service_healthy

  # Installs the JS dependencies and rebuilds the assets on change
  assets:
    build:
      context: .
      dockerfile: webapp/Dockerfile
      target: node_base
      args:
        NODE_VERSION: ${NODE_VERSION:-}
        PYTHON_VERSION: ${PYTHON_VERSION:-}
        UV_VERSION: ${UV_VERSION:-}
    user: "${HOST_UID:-0}:0"
    working_dir: /app
    command: webapp/bin/dev-assets.sh
    volumes:
      - .:/app
      # Linux binaries, kept apart from the node_modules of the host
      - node_modules:/app/node_modules
      - webapp_node_modules:/app/webapp/node_modules
      - revue_node_modules:/app/webapp/revue-front/node_modules
    environment:
      BASE_URL: ${BASE_URL:-http://quefairedemesdechets.localhost}
    healthcheck:
      test: ["CMD-SHELL", "ls webapp/static/compiled/*.js"]
      interval: 5s
      retries: 5
      start_period: 600s

  proxy:
    build:
      context: .
      dockerfile: webapp/nginx/Dockerfile
    ports:
      - ${HTTP_PORT:-80}:80
    environment:
      - BASE_DOMAIN=${BASE_DOMAIN:-quefairedemesdechets.localhost}
      - PORT=80
      # The local stack serves plain HTTP; deployed, the template defaults to https
      - BASE_SCHEME=http
      - DEBUG=${DEBUG:-True}
      - NGINX_DISABLE_CACHE=${NGINX_DISABLE_CACHE:-0}
      - UPSTREAM_HOST=webapp:8000
    depends_on:
      webapp:
        condition: service_healthy

  webapp-db:
    # Native architecture by default; POSTGIS_IMAGE_PLATFORM=linux/amd64 forces emulation
    platform: ${POSTGIS_IMAGE_PLATFORM:-}
    image: imresamu/postgis:16-3.5-alpine # The official PostGIS image ships no ARM build
    environment:
      - POSTGRES_USER=webapp
      - POSTGRES_PASSWORD=webapp # pragma: allowlist secret
      - POSTGRES_DB=webapp
    volumes:
      - webapp_dbdata:/var/lib/postgresql/data
    ports:
      # On the loopback, on a free port picked by Docker unless the variable
      # sets one: `make ports` shows it
      - 127.0.0.1:${WEBAPP_DB_PORT:-}:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "webapp"]
      interval: 2s
      retries: 30

  warehouse-db:
    # Native architecture by default; POSTGIS_IMAGE_PLATFORM=linux/amd64 forces emulation
    platform: ${POSTGIS_IMAGE_PLATFORM:-}
    image: imresamu/postgis:16-3.5-alpine # The official PostGIS image ships no ARM build
    environment:
      - POSTGRES_USER=warehouse
      - POSTGRES_PASSWORD=warehouse # pragma: allowlist secret
      - POSTGRES_DB=warehouse
    volumes:
      - warehouse16_dbdata:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:${WAREHOUSE_DB_PORT:-}:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-U", "warehouse"]
      interval: 2s
      retries: 30
    profiles: [airflow]

  airflow-db:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow # pragma: allowlist secret
      POSTGRES_DB: airflow
    volumes:
      - airflow_dbdata:/var/lib/postgresql/data
    ports:
      - 127.0.0.1:${AIRFLOW_DB_PORT:-}:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    profiles: [airflow]

  airflow-webserver:
    <<: *airflow-common
    user: "0:0"
    build:
      context: .
      dockerfile: data-platform/airflow-webserver.Dockerfile
      args:
        <<: *airflow-build-args
    deploy:
      resources:
        limits:
          memory: 2G
    ports:
      - ${AIRFLOW_PORT:-8080}:8080
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/version"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
    profiles: [airflow]

  airflow-scheduler:
    <<: *airflow-common
    build:
      context: .
      dockerfile: data-platform/airflow-scheduler.Dockerfile
      args:
        <<: *airflow-build-args
    deploy:
      resources:
        limits:
          # TODO: read AIRFLOW_SCHEDULER_MEMORY_LIMIT from .env doesn't works
          memory: ${AIRFLOW_SCHEDULER_MEMORY_LIMIT:-12G}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8974/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    depends_on:
      <<: *airflow-common-depends-on
      airflow-webserver:
        condition: service_healthy
    profiles: [airflow]

  airflow-dag-processor:
    <<: *airflow-common
    build:
      context: .
      dockerfile: data-platform/airflow-dag-processor.Dockerfile
      args:
        <<: *airflow-build-args
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    depends_on:
      <<: *airflow-common-depends-on
      airflow-webserver:
        condition: service_healthy
    profiles: [airflow]

volumes:
  webapp_dbdata:
  # Renamed with the move to Postgres 16: a 15 data directory does not start on 16
  warehouse16_dbdata:
  airflow_dbdata:
  node_modules:
  webapp_node_modules:
  revue_node_modules:
