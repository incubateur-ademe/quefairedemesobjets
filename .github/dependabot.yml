# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://docs.github.com/en/code-security/tutorials/secure-your-dependencies/optimizing-pr-creation-version-updates

version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/"
    open-pull-requests-limit: 100
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00" # UTC
    cooldown:
      default-days: 7
    allow:
      - dependency-type: "all"
    groups:
      # Covers transitive dependencies too, which dependency-type groups miss.
      python-minor-patch:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/"
    open-pull-requests-limit: 100
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:15" # UTC
    cooldown:
      default-days: 7
    allow:
      - dependency-type: "all"
    ignore:
      # TypeScript 7 (native compiler) has no JS compiler API: ts-jest and
      # typescript-eslint require typescript <7. Drop once they support it.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # @swc/core >=1.16.12 refuses to load its native binding on Scalingo
      # (ERR_SWC_NATIVE_CACHE: build dir parent is group-writable). Pinned via
      # `overrides` in package.json; drop both once SWC relaxes the check.
      - dependency-name: "@swc/core*"
        versions: [">=1.16.12"]
    groups:
      # Major bumps stay in per-family PRs, as they can need code changes
      babel:
        update-types:
          - "major"
        patterns:
          - "@babel/*"
      parcel:
        update-types:
          - "major"
        patterns:
          - "@parcel/*"
          - "parcel"
          - "parcel*"
      protobufjs:
        update-types:
          - "major"
        patterns:
          - "@protobufjs/*"
          - "protobufjs"
      swc:
        update-types:
          - "major"
        patterns:
          - "@swc/*"
          - "swc"
      mapbox:
        update-types:
          - "major"
        patterns:
          - "@mapbox/*"
          - "mapbox*"
      sentry:
        update-types:
          - "major"
        patterns:
          - "@sentry/*"
          - "sentry*"
      jest:
        update-types:
          - "major"
        patterns:
          - "*jest*"
          - "@types/jest"
      eslint:
        update-types:
          - "major"
        patterns:
          - "*eslint*"
      hotwired:
        update-types:
          - "major"
        patterns:
          - "@hotwired/*"
      iframe-resizer:
        update-types:
          - "major"
        patterns:
          - "@iframe-resizer/*"
      maplibre:
        update-types:
          - "major"
        patterns:
          - "maplibre-gl"
          - "@maplibre/*"
      postcss:
        update-types:
          - "major"
        patterns:
          - "postcss*"
      playwright:
        update-types:
          - "major"
        patterns:
          - "*playwright*"
      gouvfr:
        update-types:
          - "major"
        patterns:
          - "@gouvfr/*"
      testing:
        update-types:
          - "major"
        patterns:
          - "@testing-library/*"
      typescript-toolchain:
        update-types:
          - "major"
        patterns:
          - "typescript*"
          - "ts-jest"
          - "ts-node"

      # Every minor and patch bump goes in a single PR
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    open-pull-requests-limit: 100
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:30" # UTC
    cooldown:
      default-days: 7
    allow:
      - dependency-type: "all"
    groups:
      github-actions-all:
        patterns:
          - "*"

  - package-ecosystem: "terraform"
    directories:
      - "/infrastructure/modules/*"
      - "/infrastructure/environments/*/*"
    open-pull-requests-limit: 100
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:45" # UTC
    cooldown:
      default-days: 7
    allow:
      - dependency-type: "all"
    groups:
      terraform-all:
        patterns:
          - "*"
