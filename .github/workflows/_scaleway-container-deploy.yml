on:
  workflow_call:
    inputs:
      container_id:
        type: string
        required: true
      registry_image:
        type: string
        required: true

jobs:
  deploy_container:
    name: Scaleway deploy container
    runs-on: ubuntu-slim
    env:
      CONTAINER_ID: ${{ inputs.container_id }}
      REGISTRY_IMAGE: ${{ inputs.registry_image }}
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
      SCW_DEFAULT_REGION: fr-par
    steps:
    - name: Setup Scaleway CLI
      uses: scaleway/action-scw@2e34a1eb35cf3cac627f24643a101fea269cbd83
      with:
        version: v2.56.0

    # See https://www.scaleway.com/en/docs/serverless-containers/api-cli/deploy-container-cli/
    # Note: since Scaleway CLI v2.56.0 the container API migrated from v1beta1
    # to v1, which renamed `registry-image` to `image`.
    - name: Update image
      run: |
        scw container container update $CONTAINER_ID \
          image=$REGISTRY_IMAGE \
          region=$SCW_DEFAULT_REGION

    - name: Check deployment status
      run: |
        while true; do
            CONTAINER=$(scw container container get $CONTAINER_ID region=$SCW_DEFAULT_REGION -o json || true)
            STATUS=$(jq -r '.status' <<< "$CONTAINER")

            echo "Current status: $STATUS"

            if [ "$STATUS" == "ready" ]; then
                echo "🎉 $REGISTRY_IMAGE is deployed."
                break
            fi
            if [ "$STATUS" == "error" ]; then
                ERROR=$(jq -r '.error_message // "Scaleway gave no error message"' <<< "$CONTAINER")
                echo "::error title=Scaleway deployment failed::$REGISTRY_IMAGE: ${ERROR//$'\n'/%0A}"
                exit 1
            fi

            sleep 5
        done

# Address actions/missing-workflow-permissions rule in
# code scanning alerts
permissions:
  contents: read
