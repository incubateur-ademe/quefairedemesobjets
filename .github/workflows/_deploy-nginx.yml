on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      tag_name:
        type: string
        required: true

# The S3 state backend has no locking: two applies of the same stack must
# never overlap. Build included, so an older run cannot apply after a newer
# one. Queue rather than cancel, so an apply in flight finishes (a caller
# that cancels its own run still cancels this one).
concurrency:
  group: deploy-nginx-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  nginx_docker:
    name: 🐳 Nginx gateway Docker
    uses: ./.github/workflows/_nginx-build-and-push-docker.yml
    secrets: inherit # pragma: allowlist secret`
    with:
      image_tag: ${{ inputs.tag_name }}
      environment: ${{ inputs.environment }}

  deploy_scaleway_nginx:
    name: 🟣⏳ Scaleway nginx gateway
    needs: [nginx_docker]
    uses: ./.github/workflows/_terragrunt-apply-stack.yml
    secrets: inherit # pragma: allowlist secret`
    with:
      environment: ${{ inputs.environment }}
      stack: nginx_containers
      image_tag: ${{ inputs.tag_name }}

permissions:
  contents: read
