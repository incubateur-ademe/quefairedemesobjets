name: 🏗️ Infrastructure

on:
  workflow_call:

jobs:
  format:
    name: 📝 Format Tofu + Terragrunt
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Terragrunt and OpenTofu
        uses: gruntwork-io/terragrunt-action@8c1d96b76d445fd2e41475a3f0b63dcd1d9cc077 # v3.4.1
        with:
          tg_version: "0.83.2"
          tofu_version: "1.10.3"

      - name: Run Tofu format check
        run: tofu fmt -recursive -check infrastructure

      - name: Run Terragrunt format check
        run: terragrunt hcl fmt -check infrastructure

  nginx:
    name: 🧩 nginx templates
    # Needs docker and ruby, both on ubuntu-latest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Render servers.conf.erb and run nginx -t
        run: make nginx-check

# Address actions/missing-workflow-permissions rule in
# code scanning alerts
permissions:
  contents: read
