name: 🧱 Terragrunt apply

on:
  workflow_call:
    inputs:
      pr_number:
        description: "Pull request number — materialises infrastructure/environments/preview/pr-<n> from _template, exposed as PR_NUMBER"
        type: string
        required: true
      image_tag:
        description: "Webapp image tag to deploy (e.g. pr-123-abc1234)"
        type: string
        required: true
      environment:
        description: "GitHub environment to load secrets from (e.g. preview)"
        type: string
        required: true
      ref:
        description: "Git ref to checkout (defaults to the event's ref)"
        type: string
        required: false
        default: ""
      clear_db:
        description: "Whether to clear and re-seed the database (e.g. when preview:cleardb label is present)"
        type: string
        required: false
        default: "false"
      isoprod:
        description: "Whether the preview replicates production: database seeded from the latest production backup, container always on (preview:isoprod label)"
        type: string
        required: false
        default: "false"
    outputs:
      endpoint:
        description: "Public URL of the preview: pr-<n>.<preview_domain> on the preprod gateway, or the container's Scaleway address"
        value: ${{ jobs.terragrunt.outputs.endpoint }}

jobs:
  terragrunt:
    name: 🧱 Terragrunt apply (pr-${{ inputs.pr_number }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    outputs:
      endpoint: ${{ steps.endpoint.outputs.endpoint }}
    env:
      # Scaleway provider + S3 backend creds
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}

      # The S3 backend block generated by root.hcl reads access_key/secret_key
      # from TF vars; explicit TF_VAR_ env vars take precedence over the
      # placeholder inputs in root.hcl.
      TF_VAR_access_key: ${{ secrets.SCW_ACCESS_KEY }}
      TF_VAR_secret_key: ${{ secrets.SCW_SECRET_KEY }}
      TF_VAR_project_id: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      TF_VAR_organization_id: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}

      # AWS_*: the S3 backend uses the AWS SDK and reads these too
      AWS_ACCESS_KEY_ID: ${{ secrets.SCW_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.SCW_SECRET_KEY }}
      AWS_DEFAULT_REGION: fr-par

      # Inputs read by the preview templates via get_env(...). Their secrets
      # come from Secret Manager (/terraform/preview), read by root.hcl.
      SCW_DEFAULT_REGION: fr-par
      PR_NUMBER: ${{ inputs.pr_number }}
      IMAGE_TAG: ${{ inputs.image_tag }}
      CLEAR_DB: ${{ inputs.clear_db }}
      ISOPROD: ${{ inputs.isoprod }}

      TG_NON_INTERACTIVE: "true"

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup-terragrunt

      - name: Install postgres client (for null_resource provisioners)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends postgresql-client

      - name: Materialise per-PR terragrunt stack from _template
        run: |
          set -euo pipefail
          SRC="infrastructure/environments/preview/_template"
          DST="infrastructure/environments/preview/pr-${{ inputs.pr_number }}"
          cp -r "$SRC" "$DST"
          ls -la "$DST"

      - name: Terragrunt apply
        working-directory: infrastructure/environments/preview/pr-${{ inputs.pr_number }}
        run: |
          set -euo pipefail

          # run --all walks the unit DAG: database and object_storage here.
          # Init is implicit (auto-init) and -auto-approve is added
          # automatically in --all mode; TG_NON_INTERACTIVE is set job-wide.
          # --queue-exclude-external keeps the shared ../../namespace unit
          # out of the queue; container and gateway_domain are applied by
          # the next steps.
          # Teardown is not done with terragrunt: see preview-down.yml.
          terragrunt run --all --queue-exclude-external --queue-exclude-dir container --queue-exclude-dir gateway_domain -- apply 2>&1 | tee apply.log
          {
            echo "## Terragrunt apply (pr-${{ inputs.pr_number }})"
            echo
            echo '```'
            tail -n 100 apply.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # As on preprod and prod: migrations run before the new image is
      # rolled out, never at container start.
      - name: Run bin/post_deploy in the new image
        working-directory: infrastructure/environments/preview/pr-${{ inputs.pr_number }}/container
        run: "$GITHUB_WORKSPACE/scripts/infrastructure/post_deploy.sh"

      - name: Terragrunt apply (container)
        working-directory: infrastructure/environments/preview/pr-${{ inputs.pr_number }}/container
        run: terragrunt apply -auto-approve

      # Attaches nothing while preview_domain is empty in preprod/env.hcl
      - name: Attach pr-${{ inputs.pr_number }} to the preprod gateway
        id: domain
        working-directory: infrastructure/environments/preview/pr-${{ inputs.pr_number }}/gateway_domain
        run: |
          set -uo pipefail
          if terragrunt apply -auto-approve 2>&1 | tee apply.log && URL=$(terragrunt output -raw url); then
            echo "url=$URL" >> "$GITHUB_OUTPUT"
          else
            # The preview stays usable on its Scaleway address
            echo "::warning title=Preview domain::pr-${{ inputs.pr_number }} could not be attached to the preprod gateway (see this step, 50 domains per container at most): the preview is served on its Scaleway address only."
          fi

      - name: Read preview public endpoint
        id: endpoint
        working-directory: infrastructure/environments/preview/pr-${{ inputs.pr_number }}/container
        env:
          DOMAIN_URL: ${{ steps.domain.outputs.url }}
        run: |
          set -euo pipefail
          ENDPOINT="$DOMAIN_URL"
          if [[ -z "$ENDPOINT" ]]; then
            ENDPOINT=$(terragrunt output -raw public_endpoint)
            [[ "$ENDPOINT" == http* ]] || ENDPOINT="https://${ENDPOINT}"
          fi
          echo "endpoint=$ENDPOINT" >> "$GITHUB_OUTPUT"
          echo "Preview endpoint: $ENDPOINT"

permissions:
  contents: read
