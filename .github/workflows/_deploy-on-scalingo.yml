on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      app_name_key:
        required: true
        type: string

jobs:
  deploy-on-scalingo:
    name: Deploy to Scalingo
    runs-on: "ubuntu-slim"
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.url.outputs.url }}

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: kolok/deploy-to-scalingo@3c03e17a8815000194aa06289db6e80ef1a687bc # v1
        id: deploy
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
          known-host: ssh.osc-fr1.scalingo.com
          app-name: ${{ vars[inputs.app_name_key] }}

      - name: Set environment URL
        id: url
        run: echo "url=${{ vars.URL }}" >> $GITHUB_OUTPUT

      - uses: jtalk/url-health-check-action@e7d5ebdc9027fbf494d2d034f3e8fc78f8b7a2b9 # v5
        id: healthcheck
        with:
          url: ${{ vars.HEALTHCHECK_URLS }}
          max-attempts: 3
          retry-delay: 5s
          retry-all: true

# Address actions/missing-workflow-permissions rule in
# code scanning alerts
permissions:
  contents: read
