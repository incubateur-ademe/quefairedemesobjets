name: 🤖 CI

on:
  workflow_call:
    inputs:
      skip:
        description: "Skip every job while still reporting the required checks"
        required: false
        type: boolean
        default: false

env:
  PGHOST: localhost
  PGPORT: 5432
  PGUSER: webapp
  PGPASSWORD: webapp # pragma: allowlist secret
  PGDATABASE: webapp
  UV_PROJECT_ENVIRONMENT: .venv
  BASE_URL: http://localhost:8000
  DATABASE_URL: "postgres://webapp:webapp@localhost:5432/webapp" # pragma: allowlist secret
  SECRET_KEY: coucou # pragma: allowlist secret
  CI: true

jobs:
  changes:
    name: 🔎 Changed areas
    if: ${{ !inputs.skip }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      # Empty outputs run everything: outside a pull request, or if the filter fails.
      python: ${{ steps.areas.outputs.other == 'true' && 'true' || steps.areas.outputs.python }}
      frontend: ${{ steps.areas.outputs.other == 'true' && 'true' || steps.areas.outputs.frontend }}
      revue: ${{ steps.areas.outputs.other == 'true' && 'true' || steps.areas.outputs.revue }}
      infra: ${{ steps.areas.outputs.other == 'true' && 'true' || steps.areas.outputs.infra }}
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Find changed areas
        id: areas
        if: github.event_name == 'pull_request'
        continue-on-error: true
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: .github/ci-areas.yml
          predicate-quantifier: some-with-excludes
          # In a stack, compare with the stack base: the top pull request stands
          # for the whole stack. The action only reads `base` without a token.
          token: ""
          base: ${{ github.event.pull_request.stack.base.sha || github.event.pull_request.base.sha }}

  backend-webapp-linter:
    name: 📝 Backend Webapp Linter
    needs: changes
    if: ${{ !cancelled() && !inputs.skip && needs.changes.outputs.python != 'false' }}
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup backend Python environment
        uses: ./.github/actions/setup-backend
        with:
          uv-groups: "--group lint"

      - name: Check code formatting (Black + Ruff)
        run: make -C webapp check-format

  data-platform-linter:
    name: 📝 Data Platform Linter
    needs: changes
    if: ${{ !cancelled() && !inputs.skip && needs.changes.outputs.python != 'false' }}
    runs-on: ubuntu-latest
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse # pragma: allowlist secret
      POSTGRES_DB: warehouse
      POSTGRES_SCHEMA: public
    services:
      postgres:
        image: postgis/postgis:15-3.3-alpine
        options: >-
          --health-cmd pg_isready
          --health-interval 1s
          --health-timeout 1s
          --health-retries 50
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: warehouse # pragma: allowlist secret
          POSTGRES_DB: warehouse
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup backend Python environment
        uses: ./.github/actions/setup-backend
        with:
          uv-groups: "--group lint"

      - name: Cache DBT packages
        id: cache-dbt-packages
        uses: actions/cache@v6
        with:
          path: data-platform/dbt/dbt_packages
          key: dbt-packages-${{ hashFiles('data-platform/dbt/packages.yml', 'data-platform/dbt/package-lock.yml') }}

      - name: Install DBT dependencies
        if: steps.cache-dbt-packages.outputs.cache-hit != 'true'
        working-directory: data-platform/dbt
        run: uv run dbt deps

      - name: Check dbt database connection
        working-directory: data-platform/dbt
        run: uv run dbt debug

      - name: Check code formatting (Black + Ruff + SqlFluff)
        run: make -C data-platform check-format

  infrastructure-linter:
    name: 📝 Infrastructure Linter
    needs: changes
    if: ${{ !cancelled() && !inputs.skip && needs.changes.outputs.infra != 'false' }}
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Terragrunt and OpenTofu
        uses: gruntwork-io/terragrunt-action@8c1d96b76d445fd2e41475a3f0b63dcd1d9cc077 # v3.4.1
        with:
          tg_version: "0.83.2"
          tofu_version: "1.10.3"

      - name: Run Tofu format check
        run: tofu fmt -recursive -check infrastructure

      - name: Run Terragrunt format check
        run: terragrunt hcl fmt -check infrastructure

  frontend_linter:
    name: 📝 Frontend Linter
    needs: changes
    if: ${{ !cancelled() && !inputs.skip && needs.changes.outputs.frontend != 'false' }}
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup frontend environment
        uses: ./.github/actions/setup-frontend
        with:
          working-directory: webapp

      - name: Check code formatting
        run: npm run format:check
        working-directory: webapp

  backend_unit_tests:
    name: ✅ Backend Unit Tests
    needs: [changes, backend-webapp-linter]
    if: ${{ !cancelled() && contains(fromJSON('["success", "skipped"]'), needs.backend-webapp-linter.result) }}
    uses: ./.github/workflows/_backend-test-job.yml
    with:
      skip: ${{ inputs.skip || needs.changes.outputs.python == 'false' }}
      make-target: unit-test
      check-migrations: true

  backend_integration_tests:
    name: ✅ Backend Integration Tests
    needs: [changes, backend-webapp-linter]
    if: ${{ !cancelled() && contains(fromJSON('["success", "skipped"]'), needs.backend-webapp-linter.result) }}
    uses: ./.github/workflows/_backend-test-job.yml
    with:
      skip: ${{ inputs.skip || needs.changes.outputs.python == 'false' }}
      make-target: integration-test

  backend_data_tests:
    name: ✅ Backend Data Tests
    needs: [changes, data-platform-linter]
    if: ${{ !cancelled() && contains(fromJSON('["success", "skipped"]'), needs.data-platform-linter.result) }}
    uses: ./.github/workflows/_backend-test-job.yml
    with:
      skip: ${{ inputs.skip || needs.changes.outputs.python == 'false' }}
      working-directory: data-platform
      make-target: dags-test

  frontend_tests:
    name: ✅ Frontend Tests
    runs-on: ubuntu-slim
    needs: frontend_linter
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup frontend environment
        uses: ./.github/actions/setup-frontend

      - name: Run tests
        run: |
          cp .env.template .env
          npm run test
        working-directory: webapp

  revue_frontend:
    name: ✅ Review Screen Frontend (revue-front)
    needs: changes
    if: ${{ !cancelled() && !inputs.skip && needs.changes.outputs.revue != 'false' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup frontend environment
        uses: ./.github/actions/setup-frontend
        with:
          working-directory: webapp/revue-front

      - name: Check code formatting
        run: npm run format:check
        working-directory: webapp/revue-front

      - name: Lint
        run: npm run lint
        working-directory: webapp/revue-front

      - name: Typecheck
        run: npm run typecheck
        working-directory: webapp/revue-front

      - name: Run tests
        run: npm run test
        working-directory: webapp/revue-front

      - name: Build
        run: npm run build
        working-directory: webapp/revue-front

  revue_api_types:
    name: 📝 Review Screen API Types Up To Date
    needs: changes
    if: ${{ !cancelled() && !inputs.skip && (needs.changes.outputs.revue != 'false' || needs.changes.outputs.python != 'false') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      # Django (GeoDjango) is loaded to export the OpenAPI schema
      - name: Install GIS packages
        uses: ./.github/actions/install-gis

      - name: Setup backend Python environment
        uses: ./.github/actions/setup-backend

      - name: Setup frontend environment
        uses: ./.github/actions/setup-frontend

      - name: Regenerate the OpenAPI schema and the TypeScript types
        run: npm run api:types
        working-directory: webapp/revue-front

      - name: Fail if the committed types are outdated
        run: git diff --exit-code -- webapp/revue-front/src/api

# Address actions/missing-workflow-permissions rule in
# code scanning alerts
permissions:
  contents: read
