name: 🤖 CI

on:
  workflow_call:

env:
  PGHOST: localhost
  PGPORT: 5432
  PGUSER: webapp
  PGPASSWORD: webapp # pragma: allowlist secret
  PGDATABASE: webapp
  UV_PROJECT_ENVIRONMENT: .venv
  BASE_URL: http://localhost:8000
  DATABASE_URL: "postgres://webapp:webapp@localhost:5432/webapp" # pragma: allowlist secret
  SECRET_KEY: coucou # pragma: allowlist secret
  CI: true

jobs:
  backend_linter:
    name: 📝 Backend Linter
    runs-on: ubuntu-latest
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse # pragma: allowlist secret
      POSTGRES_DB: warehouse
      POSTGRES_SCHEMA: public
    services:
      postgres:
        image: postgis/postgis:15-3.3-alpine
        options: >-
          --health-cmd pg_isready
          --health-interval 1s
          --health-timeout 1s
          --health-retries 50
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: warehouse # pragma: allowlist secret
          POSTGRES_DB: warehouse
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup backend Python environment
        uses: ./.github/actions/setup-backend
        with:
          uv-groups: "--group lint"

      - name: Cache DBT packages
        id: cache-dbt-packages
        uses: actions/cache@v6
        with:
          path: data-platform/dbt/dbt_packages
          key: dbt-packages-${{ hashFiles('data-platform/dbt/packages.yml', 'data-platform/dbt/package-lock.yml') }}

      - name: Install DBT dependencies
        if: steps.cache-dbt-packages.outputs.cache-hit != 'true'
        working-directory: data-platform/dbt
        run: uv run dbt deps

      - name: Check dbt database connection
        working-directory: data-platform/dbt
        run: uv run dbt debug

      - name: Install Terragrunt and OpenTofu
        uses: gruntwork-io/terragrunt-action@8c1d96b76d445fd2e41475a3f0b63dcd1d9cc077 # v3.4.1
        with:
          tg_version: "0.83.2"
          tofu_version: "1.10.3"

      - name: Check code formatting (Black + Ruff + SqlFluff, webapp + data-platform)
        run: make check-format

      - name: Run Tofu format check
        run: tofu fmt -recursive -check infrastructure

      - name: Run Terragrunt format check
        run: terragrunt hcl fmt -check infrastructure

  frontend_linter:
    name: 📝 Frontend Linter
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup frontend environment
        uses: ./.github/actions/setup-frontend
        with:
          working-directory: webapp

      - name: Check code formatting
        run: npm run format:check
        working-directory: webapp

  backend_unit_tests:
    name: ✅ Backend Unit Tests
    needs: backend_linter
    uses: ./.github/workflows/_backend-test-job.yml
    with:
      make-target: unit-test
      check-migrations: true

  backend_integration_tests:
    name: ✅ Backend Integration Tests
    needs: backend_linter
    uses: ./.github/workflows/_backend-test-job.yml
    with:
      make-target: integration-test

  backend_data_tests:
    name: ✅ Backend Data Tests
    needs: backend_linter
    uses: ./.github/workflows/_backend-test-job.yml
    with:
      working-directory: data-platform
      make-target: dags-test

  frontend_tests:
    name: ✅ Frontend Tests
    runs-on: ubuntu-slim
    needs: frontend_linter
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Setup frontend environment
        uses: ./.github/actions/setup-frontend

      - name: Run tests
        run: |
          cp .env.template .env
          npm run test
        working-directory: webapp

# Address actions/missing-workflow-permissions rule in
# code scanning alerts
permissions:
  contents: read
