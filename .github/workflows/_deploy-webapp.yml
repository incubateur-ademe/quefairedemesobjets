on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true

# Deployments of one environment queue: a newer pending one replaces an older
# pending one, the one in flight finishes.
concurrency:
  group: deploy-webapp-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy-django:
    name: 🗺️ Webapp
    uses: ./.github/workflows/_deploy-on-scalingo.yml
    secrets: inherit # pragma: allowlist secret`
    with:
      environment: ${{ inputs.environment }}
      # Name of environment variable set in github environment
      app_name_key: DJANGO_SCALINGO_APP_NAME

# Address actions/missing-workflow-permissions rule in
# code scanning alerts
permissions:
  contents: read

