name: 🐳 Docker image for the nginx gateway

on:
  workflow_dispatch:
    inputs:
      image_tag:
        required: true
        type: string
      environment:
        required: true
        type: string
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string
      environment:
        required: true
        type: string

env:
  SCALEWAY_REGISTRY: rg.fr-par.scw.cloud
  SCALEWAY_NAMESPACE: ns-qfdmo

jobs:
  build-and-push-image:
    name: 🐳 Build and push nginx gateway Docker image
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: "[🟣 Scaleway] Log in to the Scaleway Container registry"
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.SCALEWAY_REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e

      - name: "[🟣 Scaleway] Build and push nginx gateway Docker image"
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        with:
          context: nginx
          file: nginx/nginx.Dockerfile
          platforms: linux/amd64
          cache-from: type=gha,scope=nginx-gateway
          cache-to: type=gha,scope=nginx-gateway,mode=max
          push: true
          tags: ${{ env.SCALEWAY_REGISTRY }}/${{ env.SCALEWAY_NAMESPACE }}/nginx-gateway:${{ inputs.image_tag }}

permissions:
  contents: read
