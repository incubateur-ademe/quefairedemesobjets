name: 🌚 Main to preprod

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

# A new commit replaces the run in progress: only the last one gets deployed.
# A re-run waits instead: it could be an older commit cancelling a newer one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.run_attempt == '1' }}

# Deployments do not wait for CI: a failed check must not stop preprod. The release
# waits for all of it, except for a hotfix.
jobs:
  # A hotfix is a merged pull request labeled `hotfix` (or a run dispatched
  # from a branch named after one): its draft release is written at once.
  # When the pull request cannot be read, the run is not a hotfix.
  hotfix:
    name: 🚑 Hotfix?
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pull-requests: read
    outputs:
      hotfix: ${{ steps.label.outputs.hotfix }}
    steps:
      - name: Read the labels of the merged pull request
        id: label
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          LABELS=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[].labels[].name') || LABELS=""
          if grep -qx hotfix <<<"$LABELS" || [[ "$REF_NAME" == *hotfix* ]]; then
            echo "hotfix=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Hotfix::the draft release is written without waiting for CI nor preprod"
          fi

  ci_webapp:
    name: 🌐 Webapp
    uses: ./.github/workflows/ci-webapp.yml

  ci_data_platform:
    name: 📊 Data platform
    uses: ./.github/workflows/ci-data-platform.yml

  ci_revue:
    name: 🧐 Revue
    uses: ./.github/workflows/ci-revue.yml

  ci_infrastructure:
    name: 🏗️ Infrastructure
    uses: ./.github/workflows/ci-infrastructure.yml

  webapp:
    name: 🟠 Deploy webapp
    uses: ./.github/workflows/_deploy-webapp.yml
    secrets: inherit # pragma: allowlist secret`
    with:
      environment: preprod

  airflow:
    name: 🟠 Deploy Airflow
    uses: ./.github/workflows/_deploy-airflow.yml
    secrets: inherit # pragma: allowlist secret`
    with:
      environment: preprod
      tag_name: ${{ github.sha }}

  nginx:
    name: 🟠 Deploy Nginx gateway
    uses: ./.github/workflows/_deploy-nginx.yml
    secrets: inherit # pragma: allowlist secret`
    with:
      environment: preprod
      tag_name: ${{ github.sha }}

  e2e:
    name: 🪤 E2E
    uses: ./.github/workflows/e2e.yml
    secrets: inherit #pragma: allowlist secret

  update_release_draft:
    # Uncomment when anchor are supported in GitHub Actions
    # See : https://github.com/actions/runner/issues/1182
    # <<: *release_drafter
    needs:
      [
        hotfix,
        ci_webapp,
        ci_data_platform,
        ci_revue,
        ci_infrastructure,
        webapp,
        airflow,
        nginx,
      ]
    permissions:
      contents: write
    runs-on: ubuntu-slim
    name: 🔢 Release
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        id: release-drafter
        with:
          config-name: release-config.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    if: ${{ needs.hotfix.outputs.hotfix != 'true' }}
    outputs:
      tag_name: ${{ steps.release-drafter.outputs.tag_name }}

  # Hotfix-only release draft update: neither CI nor the deployments to
  # preprod are awaited, they go on in parallel. The job above is then skipped,
  # so that it cannot open a new draft once the hotfix release is published.
  update_release_draft_for_hotfix:
    needs: [hotfix]
    # Uncomment when anchor are supported in GitHub Actions
    # See : https://github.com/actions/runner/issues/1182
    # <<: *release_drafter
    permissions:
      contents: write
    runs-on: ubuntu-slim
    name: 🔢 Release Hotfix
    steps:
      - uses: release-drafter/release-drafter@978bb0b30c5ee8cdd332ced253758157150d43f0 # v7.10.0
        with:
          config-name: release-config.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    if: ${{ needs.hotfix.outputs.hotfix == 'true' }}
