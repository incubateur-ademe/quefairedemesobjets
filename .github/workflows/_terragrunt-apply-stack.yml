# Rolls an image out by applying its Terragrunt stack: the image tag is a
# stack input (get_env("IMAGE_TAG")), so what is merged is what runs, with
# whatever else changed in the stack.
#
# The S3 state backend has no locking: the caller holds a concurrency group
# around its build and this apply.
on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub environment holding the secrets (preprod or prod)"
        type: string
        required: true
      stack:
        description: "Stack directory under infrastructure/environments/<environment>/"
        type: string
        required: true
      image_tag:
        description: "Tag to deploy. Empty: apply with the image running now"
        type: string
        required: false
        default: ""
      post_deploy:
        description: "Run bin/post_deploy from the stack's image, between the plan and the apply (webapp only)"
        type: boolean
        required: false
        default: false

jobs:
  apply:
    name: 🧱 Apply ${{ inputs.stack }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: infrastructure/environments/${{ inputs.environment }}/${{ inputs.stack }}
    env:
      # Read by the Scaleway provider and CLI, and by root.hcl for the state
      # backend. The stack's own secrets come from Secret Manager.
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
      SCW_DEFAULT_REGION: fr-par
      TG_NON_INTERACTIVE: "true"
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: ./.github/actions/setup-terragrunt

      # Read here, once the caller's concurrency group is held: an apply that
      # ran while this one was queued may have changed the running image.
      - name: Image tag
        env:
          IMAGE_TAG_INPUT: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          TAG="$IMAGE_TAG_INPUT"
          if [[ -z "$TAG" ]]; then
            # Apart, so that no init output ends up in IMAGE
            terragrunt init -input=false >/dev/null
            IMAGE=$(terragrunt output -json | jq -er '.registry_image.value')
            TAG="${IMAGE##*:}"
            echo "Keeping $IMAGE"
          fi
          echo "IMAGE_TAG=$TAG" >>"$GITHUB_ENV"

      # The gateway stack depends on the webapp one, so the webapp cannot
      # read the gateway through a dependency: it reads its state here.
      - name: Private webapp only once the gateway holds the IAM key
        if: inputs.stack == 'webapp_container'
        run: |
          set -euo pipefail
          PRIVACY=$(terragrunt render --json | jq -r '.inputs.privacy // "public"')
          [[ "$PRIVACY" == "private" ]] || exit 0
          cd ../nginx_containers
          terragrunt init -input=false >/dev/null
          if [[ "$(terragrunt output -json | jq -r '.webapp_auth_token_set.value // false')" != "true" ]]; then
            echo "::error title=Gateway without the IAM key::the webapp would become private while the gateway has no WEBAPP_AUTH_TOKEN. Set webapp_auth_token in the secret of nginx_containers and apply the gateway first."
            exit 1
          fi

      - name: Terragrunt plan
        run: terragrunt plan -out="$RUNNER_TEMP/tfplan"

      - name: Run bin/post_deploy in the new image
        if: inputs.post_deploy
        run: "$GITHUB_WORKSPACE/scripts/infrastructure/post_deploy.sh"

      - name: Terragrunt apply
        run: terragrunt apply "$RUNNER_TEMP/tfplan"

      - name: Wait for the containers to be ready
        run: |
          set -euo pipefail
          IDS=$(terragrunt output -json | jq -er '[to_entries[] | select(.key | endswith("container_id")) | .value.value] | join(" ")')
          # shellcheck disable=SC2086 # one id per word
          "$GITHUB_WORKSPACE/scripts/infrastructure/wait_container_ready.sh" $IDS

      # The plan holds the secrets in clear
      - name: Remove the plan
        if: always()
        run: rm -f "$RUNNER_TEMP/tfplan"

permissions:
  contents: read
