# Rolls an image out by applying its Terragrunt stack: the image tag is a
# stack input (get_env("IMAGE_TAG")), so what is merged is what runs, with
# whatever else changed in the stack.
#
# The S3 state backend has no locking: the caller holds a concurrency group
# around its build and this apply.
on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub environment holding the secrets (preprod or prod)"
        type: string
        required: true
      stack:
        description: "Stack directory under infrastructure/environments/<environment>/"
        type: string
        required: true
      image_tag:
        description: "Tag to deploy"
        type: string
        required: true

jobs:
  apply:
    name: 🧱 Apply ${{ inputs.stack }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: infrastructure/environments/${{ inputs.environment }}/${{ inputs.stack }}
    env:
      # Read by the Scaleway provider and CLI, and by root.hcl for the state
      # backend. The stack's own secrets come from Secret Manager.
      SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
      SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
      SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
      SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
      SCW_DEFAULT_REGION: fr-par
      IMAGE_TAG: ${{ inputs.image_tag }}
      TG_NON_INTERACTIVE: "true"
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: "1.10.0"
          tofu_wrapper: false

      - name: Install Terragrunt
        run: |
          TG_VERSION="1.1.0"
          curl -fsSL -o /usr/local/bin/terragrunt \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TG_VERSION}/terragrunt_linux_amd64"
          chmod +x /usr/local/bin/terragrunt
          terragrunt --version

      - name: Setup Scaleway CLI
        uses: scaleway/action-scw@2e34a1eb35cf3cac627f24643a101fea269cbd83
        with:
          version: v2.56.0

      - name: Terragrunt plan
        run: terragrunt plan -out="$RUNNER_TEMP/tfplan"

      - name: Terragrunt apply
        run: terragrunt apply "$RUNNER_TEMP/tfplan"

      - name: Wait for the containers to be ready
        run: |
          set -euo pipefail
          IDS=$(terragrunt output -json | jq -er '[to_entries[] | select(.key | endswith("container_id")) | .value.value] | join(" ")')
          # shellcheck disable=SC2086 # one id per word
          "$GITHUB_WORKSPACE/scripts/infrastructure/wait_container_ready.sh" $IDS

      # The plan holds the secrets in clear
      - name: Remove the plan
        if: always()
        run: rm -f "$RUNNER_TEMP/tfplan"

permissions:
  contents: read
