name: 🐳 ML inference image

# Build and push the ml_deduplication inference image to the Scaleway registry.
# All builds go into a single shared namespace (ns-ml-deduplication-inference)
# in the qfdmod-prod project, with the preprod/prod discrimination done through
# separate image names, each with its own environment tag:
# - any branch push        -> image ml-deduplication-inference-preprod, tags
#                             <sha>-preprod & preprod-latest
# - merge to main          -> image ml-deduplication-inference, tags
#                             <sha>-prod & prod-latest
# - release published      -> image ml-deduplication-inference, tags
#                             <release-tag>-prod & prod-latest
#
# The DAG defaults to the <env>-latest image, so preprod can always test the
# last built preprod image and prod is aligned on the released build.
#
# `environment:` must be a static string (expressions are not allowed), so the
# prod/preprod selection is done with jobs guarded by `if:` conditions.

on:
  workflow_dispatch:
  push:
    paths:
      - 'ml_deduplication/**'
      - '.github/workflows/ml-deduplication-inference-build-and-push.yml'
  release:
    types:
      - published

env:
  SCALEWAY_REGISTRY: rg.fr-par.scw.cloud
  SCALEWAY_NAMESPACE: ns-ml-deduplication-inference
  IMAGE_NAME: ml-deduplication-inference
  IMAGE_NAME_PREPROD: ml-deduplication-inference-preprod

jobs:
  build-and-push-preprod:
    name: 🧪 Build and push (preprod)
    if: github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    environment: preprod
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # https://github.com/docker/login-action
      - name: "[🟣 Scaleway] Log in to the Scaleway Container registry"
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ${{ env.SCALEWAY_REGISTRY }}
          username: nologin
          password: ${{ secrets.SCALEWAY_DOCKER_SECRET }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      # https://github.com/docker/build-push-action
      - name: "[🟣 Scaleway] Build and push Docker image (preprod)"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ml_deduplication
          file: ml_deduplication/Dockerfile
          platforms: linux/amd64
          load: true
          tags: |
            ${{ env.SCALEWAY_REGISTRY }}/${{ env.SCALEWAY_NAMESPACE }}/${{ env.IMAGE_NAME_PREPROD }}:${{ github.sha }}-preprod
            ${{ env.SCALEWAY_REGISTRY }}/${{ env.SCALEWAY_NAMESPACE }}/${{ env.IMAGE_NAME_PREPROD }}:preprod-latest
          build-args: |
            MODEL_DIR=models/xgboost
          cache-from: type=gha,scope=ml-deduplication-inference
          cache-to: type=gha,scope=ml-deduplication-inference,mode=max

      - name: 🔍 Trivy scan and push (${{ env.IMAGE_NAME_PREPROD }})
        uses: ./.github/actions/trivy-scan-and-push
        with:
          repository: ${{ env.SCALEWAY_REGISTRY }}/${{ env.SCALEWAY_NAMESPACE }}/${{ env.IMAGE_NAME_PREPROD }}

  build-and-push-prod:
    name: 🚀 Build and push (prod - main)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # https://github.com/docker/login-action
      - name: "[🟣 Scaleway] Log in to the Scaleway Container registry"
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ${{ env.SCALEWAY_REGISTRY }}
          username: nologin
          password: ${{ secrets.SCALEWAY_DOCKER_SECRET }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      # https://github.com/docker/build-push-action
      - name: "[🟣 Scaleway] Build and push Docker image (prod)"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ml_deduplication
          file: ml_deduplication/Dockerfile
          platforms: linux/amd64
          load: true
          tags: |
            ${{ env.SCALEWAY_REGISTRY }}/${{ env.SCALEWAY_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.sha }}-prod
            ${{ env.SCALEWAY_REGISTRY }}/${{ env.SCALEWAY_NAMESPACE }}/${{ env.IMAGE_NAME }}:prod-latest
          build-args: |
            MODEL_DIR=models/xgboost
          cache-from: type=gha,scope=ml-deduplication-inference
          cache-to: type=gha,scope=ml-deduplication-inference,mode=max

      - name: 🔍 Trivy scan and push (${{ env.IMAGE_NAME }})
        uses: ./.github/actions/trivy-scan-and-push
        with:
          repository: ${{ env.SCALEWAY_REGISTRY }}/${{ env.SCALEWAY_NAMESPACE }}/${{ env.IMAGE_NAME }}

  build-and-push-prod-release:
    name: 🎯 Build and push (prod - release)
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    environment: prod
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      # https://github.com/docker/login-action
      - name: "[🟣 Scaleway] Log in to the Scaleway Container registry"
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6
        with:
          registry: ${{ env.SCALEWAY_REGISTRY }}
          username: nologin
          password: ${{ secrets.SCALEWAY_DOCKER_SECRET }}

      - uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5

      # https://github.com/docker/build-push-action
      - name: "[🟣 Scaleway] Build and push Docker image (release)"
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ml_deduplication
          file: ml_deduplication/Dockerfile
          platforms: linux/amd64
          load: true
          tags: |
            ${{ env.SCALEWAY_REGISTRY }}/${{ env.SCALEWAY_NAMESPACE }}/${{ env.IMAGE_NAME }}:${{ github.event.release.tag_name }}-prod
            ${{ env.SCALEWAY_REGISTRY }}/${{ env.SCALEWAY_NAMESPACE }}/${{ env.IMAGE_NAME }}:prod-latest
          build-args: |
            MODEL_DIR=models/xgboost
          cache-from: type=gha,scope=ml-deduplication-inference
          cache-to: type=gha,scope=ml-deduplication-inference,mode=max

      - name: 🔍 Trivy scan and push (${{ env.IMAGE_NAME }})
        uses: ./.github/actions/trivy-scan-and-push
        with:
          repository: ${{ env.SCALEWAY_REGISTRY }}/${{ env.SCALEWAY_NAMESPACE }}/${{ env.IMAGE_NAME }}
