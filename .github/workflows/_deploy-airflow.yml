on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      tag_name:
        type: string
        required: true
      source_tag:
        description: "Existing image tag to reuse instead of building"
        type: string
        required: false
        default: ""

# The S3 state backend has no locking: two applies of the stack must never
# overlap. The group holds the build too, so an older run cannot apply after a
# newer one. Deployments queue: a newer pending one replaces an older pending
# one, the one in flight finishes.
concurrency:
  group: deploy-airflow-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  airflow_docker:
    name: 🐳 Images
    uses: ./.github/workflows/_airflow-build-and-push-docker.yml
    secrets: inherit # pragma: allowlist secret`
    with:
      image_tag: ${{ inputs.tag_name }}
      source_tag: ${{ inputs.source_tag }}
      environment: ${{ inputs.environment }}

  # The three containers share the tag: one apply rolls them out together,
  # with whatever else changed in the stack.
  deploy_scaleway_airflow:
    name: 🟣 Scaleway Airflow
    needs: [airflow_docker]
    uses: ./.github/workflows/_terragrunt-apply-stack.yml
    secrets: inherit # pragma: allowlist secret`
    with:
      environment: ${{ inputs.environment }}
      stack: airflow_containers
      image_tag: ${{ inputs.tag_name }}

# Address actions/missing-workflow-permissions rule in
# code scanning alerts
permissions:
  contents: read
