name: Trivy image scan
description: Scan a pushed image for HIGH/CRITICAL vulnerabilities that have a fix
inputs:
  image-ref:
    description: Image reference, ideally pinned by digest
    required: true
runs:
  using: composite
  steps:
    - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
      with:
        image-ref: ${{ inputs.image-ref }}
        severity: CRITICAL,HIGH
        ignore-unfixed: true
        exit-code: "1"
