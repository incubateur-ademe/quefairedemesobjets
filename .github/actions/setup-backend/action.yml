name: Setup Backend Environment
description: Install uv and Python dependencies for a project directory (webapp or data-platform)

inputs:
  working-directory:
    description: "Directory that contains pyproject.toml and uv.lock (e.g. webapp, data-platform)"
    required: false
    default: "."
  uv-groups:
    description: 'Arguments passed to uv sync (e.g. "--group dev")'
    required: false
    default: "--group dev"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      with:
        enable-cache: true

    # Do not cache .venv: restored venvs pin absolute paths to the runner's Python
    # (e.g. /usr/bin/python3.12). When the image or uv-managed Python changes, uv
    # discards the venv and `uv run` may resync without dev/lint groups if sync
    # was skipped on cache hit — causing intermittent "Failed to spawn: pytest/ruff".
    # Wheel caching via setup-uv enable-cache is enough for CI speed.
    - name: Install Python dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv sync ${{ inputs.uv-groups }}
