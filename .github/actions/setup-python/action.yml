name: Setup Python Environment
description: Install uv and Python dependencies for a project directory (webapp or data-platform)

inputs:
  working-directory:
    description: "Directory that contains pyproject.toml and uv.lock (e.g. webapp, data-platform)"
    required: false
    default: "."
  uv-groups:
    description: 'Arguments passed to uv sync (e.g. "--group dev")'
    required: false
    default: "--group dev"

runs:
  using: composite
  steps:
    # UV_PYTHON outranks .python-version, which only Scalingo still reads
    - name: Read the versions from .tool-versions
      id: versions
      shell: bash
      run: |
        echo "uv=$(awk '$1 == "uv" {print $2}' .tool-versions)" >> "$GITHUB_OUTPUT"
        echo "UV_PYTHON=$(awk '$1 == "python" {print $2}' .tool-versions)" >> "$GITHUB_ENV"

    - name: Install uv
      uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39
      with:
        version: ${{ steps.versions.outputs.uv }}
        enable-cache: true

    - name: Install Python dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv sync ${{ inputs.uv-groups }}
